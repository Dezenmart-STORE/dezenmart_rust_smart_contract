[package]
name = "dezenmart_rust_smart_contract"
version = "0.1.0"
edition = "2021"



[lib]
crate-type = ["cdylib", "lib"]
name = "dezenmart_rust_smart_contract"
path = "src/lib.rs"

[dependencies]
anchor-lang = { version = "0.31.0", features = ["init-if-needed"] }
anchor-spl = "0.31.0"







[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[profile.release]
overflow-checks = true